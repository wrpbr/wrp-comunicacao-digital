worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 2m;

  # Gerado na subida do container: vazio, ou as faixas do proxy da frente (WRP_TRUSTED_PROXY).
  include /etc/nginx/wrp/realip.conf;

  limit_req_zone $binary_remote_addr zone=edge:10m rate=30r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;
    # Gerado na subida do container: redireciona para o HTTPS deste Nginx ou,
    # quando a borda da frente já fez o TLS, serve o sistema.
    include /etc/nginx/wrp/http.conf;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/poc.crt;
    ssl_certificate_key /etc/nginx/certs/poc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/wrp/app.conf;
  }
}
