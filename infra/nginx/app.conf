# Painel estático e proxy da API. Incluído pelo servidor HTTPS e, atrás de uma borda com TLS, pelo HTTP.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

root /usr/share/nginx/html;
index index.html;

# Painel de TV: SSE e WebSocket de cada unidade.
location /api/v1/tv/ {
  limit_req zone=edge burst=80 nodelay;
  include /etc/nginx/wrp/proxy.conf;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Upgrade $http_upgrade;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_pass http://wrp-api:43110;
}

location /api/ {
  limit_req zone=edge burst=60 nodelay;
  include /etc/nginx/wrp/proxy.conf;
  proxy_set_header Connection '';
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  proxy_pass http://wrp-api:43110;
}

location /docs {
  limit_req zone=edge burst=20 nodelay;
  include /etc/nginx/wrp/proxy.conf;
  proxy_pass http://wrp-api:43110;
}

location = /openapi.yaml {
  limit_req zone=edge burst=20 nodelay;
  include /etc/nginx/wrp/proxy.conf;
  proxy_pass http://wrp-api:43110;
}

location / {
  try_files $uri $uri/ /index.html;
}
