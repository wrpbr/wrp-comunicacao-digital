# Cabeçalhos que a API recebe. O endereço do visitante é o que este Nginx viu na conexão
# (ou o que a borda confiável informou), nunca o que o visitante escreveu em X-Forwarded-For:
# a auditoria e o limite por IP da API dependem dele.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
